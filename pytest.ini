[pytest]
# Only tests/: the root-level test_tidal.py is a manual sound check that boots
# SuperCollider + GHCi on import and never returns.
testpaths = tests
# The system xonsh package registers a pytest plugin that crashes current
# pytest on startup, before tests/conftest.py can point a global `pytest`
# at the venv. Blocking it is a no-op inside the venv.
addopts = -p no:xonsh
